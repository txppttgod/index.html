<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khinkali Racing Club</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f12;--card:#18181d;--card2:#202027;--line:#2b2b33;--accent:#ff4d2e;--accent-soft:#3a1a14;--gold:#f2b84b;--gold-soft:#3a2e14;
  --ok:#3ecf8e;--ok-soft:#123326;--text:#f1f1f3;--muted:#9a9aa6;--race:"Russo One",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
  padding:0 0 calc(76px + env(safe-area-inset-bottom));min-height:100vh;font-size:15px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(15,15,18,.94);
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.logo{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:var(--race);font-size:14px;letter-spacing:.5px;flex:none;transform:skewX(-8deg)}
.logo span{transform:skewX(8deg)}
.title{flex:1;min-width:0}
.title h1{margin:0;font-family:var(--race);font-weight:400;font-size:17px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.stripe{height:4px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,transparent 10px 20px);opacity:.85}
main{padding:12px 14px;max-width:720px;margin:0 auto}
section{display:none}
section.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-family:var(--race);font-weight:400;font-size:20px;margin:6px 0 12px;letter-spacing:.3px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:18px 0 8px}
.note{color:var(--muted);font-size:13px;line-height:1.5;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.err{color:var(--accent)}
/* своя карточка */
.me{position:relative;overflow:hidden;border-color:#4a2a22;background:linear-gradient(135deg,#24161a 0%,var(--card) 60%)}
.me-top{display:flex;align-items:center;gap:12px}
.me-num{font-family:var(--race);font-size:13px;color:var(--muted)}
.me-big{font-family:var(--race);font-size:34px;line-height:1.1;margin:10px 0 2px}
.me-big small{font-family:system-ui,sans-serif;font-size:14px;color:var(--muted)}
.bar{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .6s ease}
.bar.done i{background:var(--ok)}
.bar.thin{height:4px;margin-top:6px}
/* подиум */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.pod{text-align:center;cursor:pointer}
.pod .av{margin:0 auto 6px}
.pod .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .cnt{font-size:12px;color:var(--muted);margin-bottom:6px}
.step{border-radius:10px 10px 0 0;background:var(--card2);display:flex;align-items:center;justify-content:center;font-family:var(--race);font-size:22px}
.step.p1{height:78px;background:var(--gold-soft);color:var(--gold);border:1px solid #5a4620;border-bottom:0}
.step.p2{height:58px}
.step.p3{height:44px}
.pod .nm.map{white-space:normal;font-size:12px;line-height:1.3;min-height:32px;display:flex;align-items:flex-end;justify-content:center}
/* популярные карты за всё время */
.mrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.mrow:first-child{margin-top:0}
.mi{font-family:var(--race);color:var(--muted);width:16px}
.mn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc{font-family:var(--race)}
.mlogo{display:block;width:64px;height:46px;margin:0 auto 6px;border-radius:10px;object-fit:cover;background:var(--card2)}
.mthumb{width:30px;height:30px;border-radius:7px;object-fit:cover;flex:none;background:var(--card2)}
.mking{font-size:12px;color:var(--gold);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* вкладка «Рейтинги»: награды, карты, соперничества */
.aw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.awc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;min-width:0}
.awc .ico{font-size:22px;line-height:1}
.awc .t{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:8px 0 4px}
.awc .w{font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.awc .v{font-family:var(--race);font-size:18px;margin-top:2px}
.awc .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.awc.gold{border-color:#5a4620;background:linear-gradient(135deg,#2a2314 0%,var(--card) 70%)}
.prevaw{display:flex;flex-direction:column;gap:8px}
.prevaw div{display:flex;gap:10px;align-items:baseline;font-size:14px}
.prevaw b{font-weight:600}
.rv{display:flex;align-items:center;gap:10px}
.rv .side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer}
.rv .side .nm{font-size:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv .score{font-family:var(--race);font-size:26px;flex:none;text-align:center}
.rv .score small{display:block;font-family:system-ui,sans-serif;font-size:11px;color:var(--muted)}
.split{display:flex;height:6px;border-radius:4px;overflow:hidden;margin-top:10px;background:var(--card2)}
.split i{display:block;height:100%}
.split i:first-child{background:var(--accent)}
.split i:last-child{background:#6b6b78}
.streak{display:inline-block;margin-left:6px;font-size:11px;padding:2px 6px;border-radius:10px;background:var(--accent-soft);color:#ffb3a3;font-weight:500}
.rivrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rivrow:first-child{border-top:0;padding-top:0}
.rivrow .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rivrow .c{font-family:var(--race)}
/* мастерская ливрей */
.back{display:inline-block;color:var(--muted);text-decoration:none;font-size:14px;margin:4px 0 2px}
.dhead{display:flex;align-items:center;gap:12px;margin:18px 0 10px;cursor:pointer}
.lvgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lv{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;min-width:0}
.lvimg{aspect-ratio:16/10;background:var(--card2)}
.lvimg img{width:100%;height:100%;object-fit:cover;display:block}
.lvt{font-size:13px;font-weight:600;padding:8px 10px 0;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lvs{font-size:12px;color:var(--muted);padding:2px 10px 0}
.lv .lvt:last-child,.lv .lvs:last-child{padding-bottom:10px}
.lvbig{width:100%;border-radius:12px;display:block;background:var(--card2);min-height:120px}
.sheet a:not(.btn){color:#ffb3a3}
/* аватар: фото машины или гоночный номер */
.av{position:relative;width:64px;height:46px;border-radius:10px;background:var(--card2);overflow:hidden;flex:none;
  display:flex;align-items:center;justify-content:center;font-family:var(--race);font-size:17px;color:var(--text)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av .tag{position:absolute;left:4px;top:4px;font-size:10px;line-height:1;padding:3px 4px;border-radius:4px;background:rgba(0,0,0,.65);color:#fff;font-family:var(--race)}
.av.big{width:100%;height:auto;aspect-ratio:16/9;border-radius:14px;font-size:44px}
.av.lg{width:76px;height:54px}
/* список пилотов */
.chips{display:flex;gap:8px;margin:4px 0 10px}
.chip{padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:#6a2a1e;color:#ffb3a3}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.prow.mine{border-color:#6a2a1e;background:#1f1517}
.pinfo{flex:1;min-width:0}
.pname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname .you{color:var(--accent);font-weight:500;font-size:12px;margin-left:4px}
.prole{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcount{text-align:right;font-family:var(--race);font-size:16px;flex:none}
.pcount small{display:block;font-family:system-ui,sans-serif;font-size:11px;color:var(--muted)}
.pcount.done{color:var(--ok)}
/* профиль пилота */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-width:720px;max-height:88vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--race);font-weight:400;font-size:22px;margin:12px 0 2px}
.sheet .sub{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-family:var(--race);font-weight:400;font-size:22px}
.about{margin-top:12px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--card2);border-radius:0;font-size:14px;line-height:1.5}
.btn{display:block;text-align:center;margin-top:14px;padding:12px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
/* расписание */
.today{border-color:#6a2a1e;background:linear-gradient(135deg,#2a1714 0%,var(--card) 70%)}
.today .day{font-family:var(--race);font-size:13px;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.today .what{font-size:20px;font-weight:600;margin:6px 0 4px}
.days{display:flex;flex-direction:column;gap:6px}
.drow{display:flex;gap:12px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.drow .d{width:34px;flex:none;font-family:var(--race);color:var(--muted)}
.drow .w{flex:1;min-width:0}
.drow .n{font-size:12px;color:var(--muted);margin-top:2px}
.drow.past{opacity:.55}
/* правила */
.rule{margin-bottom:10px;line-height:1.6;font-size:15px}
.rule b{display:block;font-family:var(--race);font-weight:400;color:var(--gold);font-size:15px;margin-bottom:2px}
/* сводка */
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kv span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.kv b{font-family:var(--race);font-weight:400;font-size:24px}
/* нижнее меню */
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:rgba(15,15,18,.96);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
nav button{flex:1;padding:8px 4px 10px;background:none;border:0;color:var(--muted);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.active{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="logo"><span>KHR</span></div>
  <div class="title"><h1>Khinkali Racing Club</h1><div id="status">Загрузка...</div></div>
  <button class="iconbtn" onclick="loadAll()" aria-label="Обновить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8.1 8.1 0 0 0-15.5-2m-.5-4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg></button>
</header>
<div class="stripe"></div>

<main>
  <section id="pilots"></section>
  <section id="ratings"></section>
  <section id="workshop"></section>
  <section id="schedule"></section>
  <section id="rules"></section>
  <section id="summary"></section>
</main>

<div class="sheet-bg" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheetBody"></div></div>

<nav>
  <button data-t="pilots" onclick="show('pilots')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 14v7M10 12l-6.7-2M14 12l6.7-2"/></svg>Пилоты</button>
  <button data-t="ratings" onclick="show('ratings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Рейтинги</button>
  <button data-t="schedule" onclick="show('schedule')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/></svg>Неделя</button>
  <button data-t="rules" onclick="show('rules')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19a9 9 0 0 1 9 0 9 9 0 0 1 9 0M3 6a9 9 0 0 1 9 0 9 9 0 0 1 9 0M3 6v13M12 6v13M21 6v13"/></svg>Правила</button>
  <button data-t="summary" onclick="show('summary')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Сводка</button>
</nav>

<script>
// Telegram: сообщаем, что приложение готово, и красим шапку Телеграма в цвет приложения
const TG = window.Telegram && window.Telegram.WebApp;
if (TG) { TG.ready(); TG.expand(); try { TG.setHeaderColor('#0f0f12'); TG.setBackgroundColor('#0f0f12'); } catch (e) {} }

// Телеграм на телефоне держит старую копию страницы. Сверяем версию с сайтом и, если вышла новая,
// перезагружаемся по другому адресу (?v=…), чтобы взять свежую. Хвост адреса с данными Телеграма сохраняем.
const APP_VERSION = '2026-11-12c';
fetch(location.pathname + '?nocache=' + Date.now(), { cache: 'no-store' })
  .then(r => r.text())
  .then(t => {
    const m = t.match(/APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) location.replace(location.pathname + '?v=' + m[1] + location.hash);
  })
  .catch(() => {});

// Ссылки на опубликованные листы таблицы (gid каждой вкладки)
const BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR4hL-1v8UUlMxTynXm6gtaCK0KLgjAtxmxONulVDd0HWh4khlTbzaYICkV8xr_3w/pub?single=true&output=csv&gid=';
const SHEETS = { rules: '132127449', schedule: '900781415', pilots: '1543070136', summary: '1464761771' };
const DAYS = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
const SHORT = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
// Дуэли, фото машин и подписи отдаёт бот. Бесплатный Render засыпает — первый ответ может идти до минуты.
const BOT_URL = 'https://khr-bot.onrender.com';
const BOT_PROFILE_LINK = 'https://t.me/Khin_raci_bot?start=profile';

let data = null, duelData = null, pilotSort = 'duels';
// Ник того, кто открыл приложение в Телеграме (в обычном браузере его нет) — для своей карточки и подсветки
// (в обычном браузере для проверки можно открыть с ?me=ник)
const myUsername = (((TG && TG.initDataUnsafe.user) || {}).username || new URLSearchParams(location.search).get('me') || '').toLowerCase();
const tgKey = tg => String(tg || '').trim().replace(/^@/, '').toLowerCase();
const isMe = tg => myUsername !== '' && tgKey(tg) === myUsername;

// Разбор CSV: поддерживает кавычки и переносы строк внутри ячеек
function parseCSV(text) {
  const rows = []; let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; }
      else field += c;
    } else {
      if (c === '"') quoted = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x !== ''));
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const cells = r => r.filter(x => x !== '');
const num = x => parseFloat(String(x || '0').replace(',', '.')) || 0;

async function loadAll() {
  document.getElementById('status').textContent = 'Загрузка...';
  loadDuels();  // параллельно с таблицей: бот может отвечать дольше
  try {
    const entries = await Promise.all(Object.entries(SHEETS).map(async ([key, gid]) => {
      const r = await fetch(BASE + gid, { cache: 'no-store' });
      if (!r.ok) throw new Error(key);
      return [key, parseCSV(await r.text())];
    }));
    data = Object.fromEntries(entries);
    renderAll();
    setStatus();
  } catch (e) {
    document.getElementById('status').innerHTML = '<span class="err">Не удалось загрузить таблицу</span>';
  }
}

function setStatus() {
  const t = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  const week = duelData && duelData.week ? 'Неделя ' + duelData.week + ' · ' : '';
  document.getElementById('status').textContent = week + 'обновлено в ' + t;
}

async function loadDuels() {
  duelData = null;
  try {
    const r = await fetch(BOT_URL + '/duels?t=' + Date.now(), { cache: 'no-store' });
    duelData = await r.json();
    if (!duelData.pilots) duelData = { error: true };
  } catch (e) { duelData = { error: true }; }
  if (data) { renderPilots(); renderRatings(); renderWorkshop(); setStatus(); }
}

function renderAll() {
  renderPilots();
  renderRatings();
  renderWorkshop();
  renderSchedule();
  renderRules();
  renderSummary();
}

// ---------- Пилоты ----------
function pilotRows() {
  const head = (data.pilots.find(r => r[0] === '№') || []).map(h => h.toLowerCase());
  const iRole = head.findIndex(h => h.startsWith('роль'));
  return data.pilots.filter(r => /^\d+$/.test(r[0] || '')).map(r => ({
    num: r[0], name: r[1] || '—', tg: r[2] || '', role: (iRole >= 0 ? r[iRole] : r[r.length - 1]) || '—'
  }));
}
const ready = () => duelData && !duelData.error;
const normOf = () => ready() ? duelData.norm : 20;
const duelOf = p => (ready() && duelData.pilots[tgKey(p.tg)]) || { week: 0, prev: 0, total: 0 };
const profOf = p => (ready() && duelData.profiles && duelData.profiles[tgKey(p.tg)]) || {};

// Фото машины из профиля (если есть), иначе крупный гоночный номер
function avatar(p, cls = '') {
  const pr = profOf(p);
  const img = pr.photo ? `<img loading="lazy" alt="" src="${BOT_URL}/photo/${encodeURIComponent(tgKey(p.tg))}?v=${pr.photo}" onerror="this.remove()">` : '';
  return `<div class="av ${cls}">${img ? '' : esc(p.num)}${img}${img ? `<span class="tag">${esc(p.num)}</span>` : ''}</div>`;
}

function progress(n, norm, thin) {
  const pct = Math.min(100, Math.round(n / norm * 100));
  return `<div class="bar ${thin ? 'thin' : ''} ${n >= norm ? 'done' : ''}"><i style="width:${pct}%"></i></div>`;
}

function renderPilots() {
  const pilots = pilotRows();
  const norm = normOf();
  const taglines = data.pilots.filter(r => cells(r).length === 1 && r[0] && !/^\d/.test(r[0]) && r[0] !== 'ИТОГО' && r[0] !== 'СТАТИСТИКА ПИЛОТОВ').map(r => r[0]);
  const waiting = !duelData ? 'Загружаю дуэли от бота… Если бот спал, это займёт до минуты.'
    : !ready() ? 'Не удалось получить дуэли от бота. Нажми «обновить» через минуту.' : '';
  let html = '';

  // Своя карточка: сколько сдал и сколько осталось
  const me = pilots.find(p => isMe(p.tg));
  if (me) {
    const d = duelOf(me);
    const left = Math.max(0, norm - d.week);
    html += `<div class="card me" onclick="openPilot('${esc(me.num)}')">
      <div class="me-top">${avatar(me, 'lg')}<div style="flex:1;min-width:0"><div class="me-num">ТЫ · №${esc(me.num)}</div>
        <div class="pname">${esc(me.name)}</div><div class="prole">${esc(me.role)}</div></div></div>
      <div class="me-big">${ready() ? d.week : '…'} <small>из ${norm} дуэлей за неделю</small></div>
      ${progress(ready() ? d.week : 0, norm)}
      <div class="note" style="margin:8px 0 0">${!ready() ? '' : left ? 'Осталось ' + left + '. Скрины «История заездов» — в тему отчётов.' : 'Норма выполнена ✅'}</div>
    </div>`;
    if (!profOf(me).photo) html += `<a class="btn ghost" href="${BOT_PROFILE_LINK}">🏎 Поставить фото своей машины в ливрее клуба</a>`;
  }

  // Подиум недели
  const cls = ['p2', 'p1', 'p3'], place = ['2', '1', '3'];
  if (ready()) {
    const top = [...pilots].map(p => ({ p, n: duelOf(p).week })).filter(x => x.n > 0).sort((a, b) => b.n - a.n).slice(0, 3);
    if (top.length) {
      const order = [top[1], top[0], top[2]];
      html += `<div class="label">Лидеры недели</div><div class="podium">${order.map((x, i) => x ? `
        <div class="pod" onclick="openPilot('${esc(x.p.num)}')">${avatar(x.p)}<div class="nm">${esc(x.p.name)}</div>
          <div class="cnt">${x.n} дуэл.</div><div class="step ${cls[i]}">${place[i]}</div></div>` : '<div></div>').join('')}</div>`;
    }
  }

  if (ready()) html += `<a class="btn ghost" href="#" onclick="show('ratings');return false">🏆 Награды недели, карты и соперничества</a>`;
  if (designers().length) {
    const n = designers().reduce((s, x) => s + x.items.length, 0);
    html += `<a class="btn ghost" href="#" onclick="openWorkshop('');return false">🎨 Мастерская ливрей${n ? ' · ' + n : ''}</a>`;
  }

  // Список пилотов
  const list = [...pilots];
  if (pilotSort === 'duels') list.sort((a, b) => duelOf(b).week - duelOf(a).week || duelOf(b).prev - duelOf(a).prev || num(a.num) - num(b.num));
  else list.sort((a, b) => num(a.num) - num(b.num));
  html += `<div class="label">Пилоты · ${pilots.length}</div>
    ${waiting ? `<p class="note">${waiting}</p>` : `<p class="note">Неделя ${esc(duelData.week)}, норма ${norm} дуэлей. Нажми на пилота, чтобы открыть профиль.</p>`}
    <div class="chips"><span class="chip ${pilotSort === 'duels' ? 'on' : ''}" onclick="setSort('duels')">По дуэлям</span>
      <span class="chip ${pilotSort === 'num' ? 'on' : ''}" onclick="setSort('num')">По номеру</span></div>
    <div class="plist">${list.map(p => {
      const d = duelOf(p);
      return `<div class="prow ${isMe(p.tg) ? 'mine' : ''}" onclick="openPilot('${esc(p.num)}')">${avatar(p)}
        <div class="pinfo"><div class="pname">${esc(p.name)}${isMe(p.tg) ? '<span class="you">это ты</span>' : ''}${streakBadge(d)}</div>
          <div class="prole">${esc(p.role)}</div>${ready() ? progress(d.week, norm, true) : ''}</div>
        <div class="pcount ${ready() && d.week >= norm ? 'done' : ''}">${ready() ? d.week : '…'}<small>из ${norm}</small></div></div>`;
    }).join('')}</div>
    ${taglines.map(t => `<p class="note" style="text-align:center;margin-top:16px">${esc(t)}</p>`).join('')}`;
  document.getElementById('pilots').innerHTML = html;
}

function setSort(s) { pilotSort = s; renderPilots(); }

// Серия: сколько недель подряд выполнена норма (значок — с двух недель)
const streakBadge = d => d.streak >= 2 ? `<span class="streak">🔥 ${d.streak} нед.</span>` : '';
// Пилот по нику в игре (награды и соперничества бот присылает с ником из таблицы)
const pilotByName = n => pilotRows().find(p => p.name.toLowerCase() === String(n || '').toLowerCase());
const openByName = n => { const p = pilotByName(n); if (p) openPilot(p.num); };
const nameAttr = n => esc(JSON.stringify(String(n || '')));
const short = n => String(n).replace(/\.0$/, '');

// ---------- Рейтинги: награды недели, карты, соперничества — переключаются чипами, чтобы не всё сразу ----------
let ratingTab = 'awards';
function setRating(t) { ratingTab = t; renderRatings(); }

function awardCards(aw, gold) {
  const card = (ico, title, who, val, sub) => `<div class="awc ${gold ? 'gold' : ''}" onclick='openByName(${nameAttr(who)})'>
    <div class="ico">${ico}</div><div class="t">${title}</div><div class="w">${esc(who)}</div>
    <div class="v">${val}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`;
  const out = [];
  if (aw.active) out.push(card('🔥', 'Самый активный', aw.active[0], aw.active[1] + ' дуэл.', ''));
  if (aw.sniper) out.push(card('🎯', 'Снайпер', aw.sniper[0], aw.sniper[1] + '% побед', 'из ' + aw.sniper[2] + ' дуэлей'));
  if (aw.record) out.push(card('🚀', 'Рекорд', aw.record[0], short(aw.record[1]), aw.record[2] ? esc(aw.record[2]) : ''));
  if (aw.closest) out.push(card('⚔️', 'Дуэль недели', aw.closest[0] + ' vs ' + aw.closest[1],
    short(aw.closest[2]) + ' / ' + short(aw.closest[3]), 'разница ' + short(aw.closest[4]) + (aw.closest[5] ? ' · ' + esc(aw.closest[5]) : '')));
  return out.join('');
}

function renderRatings() {
  const el = document.getElementById('ratings');
  const chips = `<h2>Рейтинги</h2><div class="chips">${[['awards', 'Награды'], ['maps', 'Карты'], ['rivals', 'Соперничества']]
    .map(([k, t]) => `<span class="chip ${ratingTab === k ? 'on' : ''}" onclick="setRating('${k}')">${t}</span>`).join('')}</div>`;
  if (!ready()) {
    el.innerHTML = chips + `<p class="note">${!duelData ? 'Загружаю данные от бота… Если бот спал, это займёт до минуты.' : 'Не удалось получить данные от бота. Нажми «обновить» через минуту.'}</p>`;
    return;
  }
  let html = chips;
  if (ratingTab === 'awards') {
    const aw = (duelData.awards || {}), cur = awardCards(aw.week || {}, false), prev = aw.prev || {};
    html += `<div class="label">Эта неделя · ${esc(duelData.week)} · пока</div>
      ${cur ? `<div class="aw">${cur}</div>` : '<p class="note">На этой неделе ещё нет дуэлей в норму.</p>'}`;
    const prevCards = awardCards(prev, true);
    if (prevCards) html += `<div class="label">Победители прошлой недели · ${esc(duelData.prev_week)}</div><div class="aw">${prevCards}</div>`;
    html += `<p class="note">Считаются только дуэли, которые идут в норму. «Снайпер» — от 10 дуэлей за неделю. «Дуэль недели» — самая близкая по счёту, где оба проехали больше 100 баллов.</p>`;
  } else if (ratingTab === 'maps') {
    const tr = duelData.tracks || {}, kings = tr.kings || {}, cls = ['p2', 'p1', 'p3'], place = ['2', '1', '3'];
    // Логотип карты ставит владелец через бота (/maplogo); строка рейтинга: [название, дуэлей, версия логотипа, ключ]
    const logo = (x, c) => x[2] ? `<img class="${c}" loading="lazy" alt="" src="${BOT_URL}/maplogo/${encodeURIComponent(x[3])}?v=${x[2]}" onerror="this.remove()">` : '';
    const king = x => kings[x[3]] ? `<div class="mking">👑 ${esc(kings[x[3]][0])} · ${kings[x[3]][1]} поб.</div>` : '';
    if (tr.week && tr.week.length) {
      const top = tr.week.slice(0, 3), order = [top[1], top[0], top[2]];
      html += `<div class="label">Карты недели</div><div class="podium">${order.map((x, i) => x ? `
        <div class="pod">${logo(x, 'mlogo')}<div class="nm map">${esc(x[0])}</div><div class="cnt">${x[1]} дуэл.</div>
          <div class="step ${cls[i]}">${place[i]}</div></div>` : '<div></div>').join('')}</div>`;
    }
    if (tr.all && tr.all.length) {
      const max = tr.all[0][1] || 1;
      html += `<div class="label">Самые играемые карты · за всё время</div><div class="card">${tr.all.map((x, i) => `
        <div class="mrow"><span class="mi">${i + 1}</span>${logo(x, 'mthumb')}<div class="mn">${esc(x[0])}${king(x)}</div><span class="mc">${x[1]}</span></div>
        <div class="bar thin"><i style="width:${Math.round(x[1] / max * 100)}%"></i></div>`).join('')}</div>
        <p class="note">👑 Король карты — у кого больше всех побед на ней за последние 10 недель.</p>`;
    }
    if (!(tr.all && tr.all.length)) html += '<p class="note">Карт пока нет — они появятся, когда бот прочитает трассы со скринов дуэлей.</p>';
  } else {
    const rv = duelData.rivalries || [];
    const side = n => { const p = pilotByName(n); return `<div class="side" onclick='openByName(${nameAttr(n)})'>${p ? avatar(p) : '<div class="av">?</div>'}<div class="nm">${esc(n)}</div></div>`; };
    html += rv.length ? rv.map(r => `<div class="card" style="margin-bottom:8px"><div class="rv">${side(r[0])}
        <div class="score">${r[2]} : ${r[3]}<small>${r[4]} дуэл.</small></div>${side(r[1])}</div>
        <div class="split"><i style="width:${r[2] + r[3] ? Math.round(r[2] / (r[2] + r[3]) * 100) : 50}%"></i><i style="flex:1"></i></div></div>`).join('')
        + '<p class="note">Пары пилотов клуба, которые чаще всего катают друг с другом, и личный счёт побед за последние 10 недель.</p>'
      : '<p class="note">Пока нет дуэлей между пилотами клуба.</p>';
  }
  el.innerHTML = html;
}

function openPilot(numStr) {
  const p = pilotRows().find(x => x.num === numStr);
  if (!p) return;
  const d = duelOf(p), pr = profOf(p), norm = normOf(), st = ready() && d.stats;
  // Ливрейщик — ссылка на его портфолио; любой пилот — ливреи, нарисованные для него
  const des = designers(), me = des.find(x => x.tg && x.tg === tgKey(p.tg));
  const lvMine = me ? me.items : [];
  const lvFor = des.flatMap(x => x.items.filter(it => it.for && it.for.toLowerCase() === p.name.toLowerCase()).map(it => ({ ...it, by: x.name })));
  const mine = isMe(p.tg);
  document.getElementById('sheetBody').innerHTML = `<div class="grab"></div>
    ${avatar(p, 'big')}
    <h3>${esc(p.name)}</h3>
    <div class="sub">№${esc(p.num)}${p.tg ? ' · ' + esc(p.tg) : ''} · ${esc(p.role)}</div>
    ${pr.about ? `<div class="about">${esc(pr.about)}</div>` : ''}
    <div class="stats">
      <div class="stat"><span>Эта неделя</span><b>${ready() ? d.week : '…'}<small style="font-size:13px;color:var(--muted)"> / ${norm}</small></b>${ready() ? progress(d.week, norm, true) : ''}</div>
      <div class="stat"><span>Прошлая неделя</span><b>${ready() ? d.prev : '…'}</b></div>
      ${st && st.n ? `
      <div class="stat"><span>Победы</span><b>${Math.round(st.w / st.n * 100)}%</b><span>${st.w} из ${st.n}</span></div>
      <div class="stat"><span>Лучший счёт</span><b>${short(st.best)}</b></div>
      <div class="stat"><span>Любимая карта</span><b style="font-size:15px">${esc(st.map || '—')}</b></div>
      <div class="stat"><span>Серия нормы</span><b>${d.streak ? '🔥 ' + d.streak : '0'}</b><span>недель подряд</span></div>` : ''}
    </div>
    ${st && st.rivals && st.rivals.length ? `<div class="label">Чаще всего катает с</div><div class="card">${st.rivals.map(r => `
      <div class="rivrow" onclick='openByName(${nameAttr(r[0])})'><span class="n">${esc(r[0])}</span><span class="note" style="margin:0">${r[1]} дуэл.</span>
        <span class="c">${r[2]} : ${r[3]}</span></div>`).join('')}</div>` : ''}
    ${st && st.n ? '<p class="note">Статистика по дуэлям в норму за последние 10 недель.</p>' : ''}
    ${lvMine.length ? `<a class="btn ghost" href="#" onclick="closeSheet();openWorkshop('${esc(tgKey(p.tg))}');return false">🎨 Портфолио ливрей · ${lvMine.length}</a>` : ''}
    ${lvFor.length ? `<div class="label">Ливреи для ${esc(p.name)}</div><div class="lvgrid">${lvFor.map(lvCard).join('')}</div>` : ''}
    ${mine ? `<a class="btn" href="${BOT_PROFILE_LINK}">${pr.photo ? 'Изменить профиль в боте' : 'Поставить фото машины'}</a>
      <p class="note" style="text-align:center">Машина на фото — обязательно в ливрее клуба</p>` : ''}
    <a class="btn ghost" href="#" onclick="closeSheet();return false">Закрыть</a>`;
  document.getElementById('sheet').classList.add('open');
  if (TG && TG.HapticFeedback) try { TG.HapticFeedback.selectionChanged(); } catch (e) {}
}
function closeSheet() { document.getElementById('sheet').classList.remove('open'); }

// ---------- Мастерская ливрей: портфолио ливрейщиков (ливреи они загружают через бота, /livery) ----------
const designers = () => (ready() && duelData.designers) || [];
const lvImg = id => `${BOT_URL}/livery/${encodeURIComponent(id)}`;
let workshopFilter = '';
// 1 ливрея, 2 ливреи, 5 ливрей
const plural = (n, one, few, many) => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many);
function lvCard(it) {
  return `<div class="lv" onclick="openLivery('${esc(it.id)}')"><div class="lvimg"><img loading="lazy" alt="" src="${lvImg(it.id)}" onerror="this.remove()"></div>
    <div class="lvt">${esc(it.t || 'Без названия')}</div>${it.for ? `<div class="lvs">для ${esc(it.for)}</div>` : ''}</div>`;
}
function openWorkshop(tg) { workshopFilter = tg || ''; renderWorkshop(); show('workshop'); }
function renderWorkshop() {
  const el = document.getElementById('workshop');
  const des = designers();
  const total = des.reduce((n, x) => n + x.items.length, 0);
  let html = `<a class="back" href="#" onclick="show('pilots');return false">← Пилоты</a><h2>Мастерская ливрей</h2>
    <p class="note">Работы ливрейщиков клуба: ${plural(total, 'ливрея', 'ливреи', 'ливрей')}. Нажми на ливрею, чтобы открыть её целиком.</p>`;
  if (!ready()) { el.innerHTML = html + '<p class="note">Загружаю данные от бота…</p>'; return; }
  if (!des.length) { el.innerHTML = html + '<p class="note">Пока нет ни одного ливрейщика. Их назначает владелец клуба командой /designer @ник.</p>'; return; }
  if (des.length > 1) html += `<div class="chips" style="flex-wrap:wrap"><span class="chip ${!workshopFilter ? 'on' : ''}" onclick="openWorkshop('')">Все</span>${des.map(x =>
    `<span class="chip ${workshopFilter === x.tg ? 'on' : ''}" onclick="openWorkshop('${esc(x.tg)}')">${esc(x.name)}</span>`).join('')}</div>`;
  for (const x of des.filter(x => !workshopFilter || x.tg === workshopFilter)) {
    const p = pilotRows().find(r => tgKey(r.tg) === x.tg);
    html += `<div class="dhead" ${p ? `onclick="openPilot('${esc(p.num)}')"` : ''}>${p ? avatar(p) : '<div class="av">🎨</div>'}
      <div style="flex:1;min-width:0"><div class="pname">${esc(x.name)}</div><div class="prole">Ливрейщик · ${plural(x.items.length, 'работа', 'работы', 'работ')}</div></div></div>
      ${x.items.length ? `<div class="lvgrid">${x.items.map(lvCard).join('')}</div>` : '<p class="note">Пока пусто — работы появятся, когда ливрейщик загрузит их через бота.</p>'}`;
  }
  el.innerHTML = html;
}
function openLivery(id) {
  let it = null, by = null;
  for (const x of designers()) { const f = x.items.find(i => String(i.id) === String(id)); if (f) { it = f; by = x; break; } }
  if (!it) return;
  const d = it.d ? new Date(it.d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
  document.getElementById('sheetBody').innerHTML = `<div class="grab"></div>
    <img class="lvbig" alt="" src="${lvImg(it.id)}">
    <h3 style="font-size:18px">${esc(it.t || 'Без названия')}</h3>
    <div class="sub">Автор: <a href="#" onclick='openByName(${nameAttr(by.name)});return false'>${esc(by.name)}</a>${d ? ' · ' + d : ''}</div>
    ${it.for ? `<div class="about">Для пилота: <a href="#" onclick='openByName(${nameAttr(it.for)});return false'>${esc(it.for)}</a></div>` : ''}
    <a class="btn ghost" href="#" onclick="closeSheet();openWorkshop('${esc(by.tg)}');return false">Все работы ${esc(by.name)}</a>
    <a class="btn ghost" href="#" onclick="closeSheet();return false">Закрыть</a>`;
  document.getElementById('sheet').classList.add('open');
}

// ---------- Неделя (расписание) ----------
function renderSchedule() {
  const todayIdx = (new Date().getDay() + 6) % 7;
  let hint = '', note = '';
  const days = [];
  for (const r of data.schedule) {
    const day = (r[0] || '').trim();
    if (day === 'Подсказка') { hint = r[1] || ''; continue; }
    if (day.startsWith('↓')) { note = day; continue; }
    const idx = DAYS.findIndex(d => d.toLowerCase() === day.toLowerCase());
    if (idx >= 0) days.push({ idx, day, what: r[2] || '—', extra: r[3] || '' });
  }
  const today = days.find(d => d.idx === todayIdx);
  document.getElementById('schedule').innerHTML = `<h2>Неделя клуба</h2>
    ${today ? `<div class="card today"><div class="day">Сегодня · ${esc(today.day)}</div><div class="what">${esc(today.what)}</div>
      ${today.extra ? `<div class="note" style="margin:0">${esc(today.extra)}</div>` : ''}</div>` : ''}
    ${note ? `<p class="note">${esc(note)}</p>` : ''}
    <div class="label">Вся неделя</div>
    <div class="days">${days.map(d => `<div class="drow ${d.idx < todayIdx ? 'past' : ''}" ${d.idx === todayIdx ? 'style="border-color:#6a2a1e"' : ''}>
      <div class="d">${SHORT[d.idx]}</div><div class="w"><div>${esc(d.what)}</div>${d.extra ? `<div class="n">${esc(d.extra)}</div>` : ''}</div></div>`).join('')}</div>
    ${hint ? `<p class="note">${esc(hint)}</p>` : ''}`;
}

// ---------- Правила ----------
// Какие строки правил выделять. Не по списку слов, а по виду строки,
// чтобы новые правила и должности из таблицы оформлялись сами, без правки кода.
function isRuleHeading(line) {
  const s = line.trim();
  return /^(Правило\s*\d+|Регламент)/i.test(s)                       // «Правило 7. …», «Регламент»
    || /^[^—–()]{1,40}\([^)]*\)\s*[—–]\s/.test(s)                     // «Настройщик (механик, …) — …»
    || /^[A-Za-zА-Яа-яЁё-]+(\s[A-Za-zА-Яа-яЁё-]+)?\s[—–]\s/.test(s)   // «Тренер — …», «Дизайнер ливрей — …»
    || (s.length < 60 && /[А-ЯЁA-Z]/.test(s) && s === s.toUpperCase()); // «ПРАВИЛА И ТРЕБОВАНИЯ»
}

function renderRules() {
  const html = data.rules.flat().filter(Boolean).map(cell =>
    cell.split('\n').map(line => {
      const t = esc(line);
      return isRuleHeading(line) ? `<b>${t}</b>` : t;
    }).join('<br>').replace(/<\/b><br>(<br>)?/g, '</b>')
  ).map(p => `<div class="card rule">${p}</div>`).join('');
  document.getElementById('rules').innerHTML = '<h2>Правила клуба</h2>' + html;
}

// ---------- Сводка ----------
function renderSummary() {
  const rows = data.summary.filter(r => r[0] && r[1] && r[0] !== 'Показатель' && r[0] !== 'Примечание');
  const note = data.summary.find(r => cells(r).length === 1 && r[0].length > 40);
  document.getElementById('summary').innerHTML =
    `<h2>Сводка по пилотам</h2>
     <div class="kv">${rows.map(r => `<div><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}</div>
     ${note ? `<p class="note">${esc(note[0])}</p>` : ''}`;
}

function show(name) {
  document.querySelectorAll('section').forEach(s => s.classList.toggle('active', s.id === name));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.t === name));
  window.scrollTo(0, 0);
}

show('pilots');
loadAll();
</script>
</body>
</html>
